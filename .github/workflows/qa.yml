name: Website QA
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Authorized staging URL
        required: true
        type: string
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci --ignore-scripts
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Scan configured target
        env:
          QA_TARGET_URL: ${{ inputs.target_url }}
        # A baseline-only scan will normally fail the coverage gate. Add your approved rules and evidence.
        run: python tester.py "$QA_TARGET_URL" --axe node_modules/axe-core/axe.min.js --enforce-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-qa-report
          path: reports/
          retention-days: 7
